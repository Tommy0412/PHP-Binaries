jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, arm32]

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget gzip bzip2 bison g++ git re2c

      - name: Setup compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ matrix.arch }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: 43fcb1e63786b96add78f89d7454709ae0159fa0

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            echo "TARGET = aarch64-linux-musl" > config.mak
          else
            echo "TARGET = arm-linux-musleabihf" > config.mak
          fi
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          ./compile.sh -t android-${{ matrix.arch == 'arm64' && echo 'aarch64' || echo 'arm' }} -x -j 4 -P 5 -c ./download_cache -D -z 8.4 2>&1 | tee build.log

      - name: Create tarball
        run: |
          mkdir -p bin
          if [ -d "bin/php7" ] && [ "$(ls -A bin/php7)" ]; then
              mv bin/php7/* bin/
              rm -rf bin/php7
          fi
          tar -czf ./PHP-8.4-Android-${{ matrix.arch }}-PM5.tar.gz bin

          if [ -d "bin-debug" ] && [ "$(ls -A bin-debug)" ]; then
              tar -czf ./Z-PHP-8.4-Android-${{ matrix.arch }}-PM5-debugging-symbols.tar.gz bin-debug
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PHP-8.4-Android-${{ matrix.arch }}-PM5
          path: |
            ./PHP-8.4-Android-${{ matrix.arch }}-PM5*.tar.gz
            build.log
