name: Build PHP binaries

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: 'Android PHP major version'
        required: true
        type: number
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
      special-release:
        description: 'Special release type to create (pm-default-latest, pm-default, none)'
        required: true
        type: string
      pm-preview:
        description: "Mark releases as pre-release"
        required: true
        type: boolean

env:
  MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-arm64

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP (arm64)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          ./compile.sh -t android-aarch64 -x -j 4 -g -P ${{ inputs.pm-version-major }} -c ./download_cache -D -z ${{ inputs.php-version-base }} 2>&1 | tee build.log

      - name: Create tarball (arm64)
        if: success()
        run: |
          # If build placed files under bin/php7, move contents into bin
          if [ -d "bin/php7" ] && [ "$(ls -A bin/php7)" ]; then
            mkdir -p bin_new
            mv bin/php7/* bin_new/ || true
            rm -rf bin
            mv bin_new bin
          fi

          if [ -d "bin" ] && [ "$(ls -A bin)" ]; then
            tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}.tar.gz bin
          else
            echo "Error: bin directory missing or empty"
            ls -la bin || true
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-arm64
          path: install.log
          if-no-files-found: warn

      - name: Upload tar contents log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tar-contents-log-arm64
          path: tar_contents.log
          if-no-files-found: warn

      - name: Upload artifacts (arm64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}*.tar.gz
            install.log
            tar_contents.log
            compile.sh
          if-no-files-found: warn

  android-arm32:
    name: Android arm32
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-arm32

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = arm-linux-musleabihf" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP (arm32)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          rm -rf ./download_cache
          set -ex
          trap "exit 1" ERR

          ./compile.sh -t android-arm -x -j 4 -g -P ${{ inputs.pm-version-major }} -c ./download_cache -D -z ${{ inputs.php-version-base }} 2>&1 | tee build.log
     
      - name: Create tarball (arm32)
        if: success()
        run: |
          # If build placed files under bin/php7, move contents into bin
          if [ -d "bin/php7" ] && [ "$(ls -A bin/php7)" ]; then
            mkdir -p bin_new
            mv bin/php7/* bin_new/ || true
            rm -rf bin
            mv bin_new bin
          fi

          if [ -d "bin" ] && [ "$(ls -A bin)" ]; then
            tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}.tar.gz bin
          else
            echo "Error: bin directory missing or empty"
            ls -la bin || true
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm32
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-arm32
          path: install.log
          if-no-files-found: warn

      - name: Upload tar contents log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tar-contents-log-arm32
          path: tar_contents.log
          if-no-files-found: warn

      - name: Upload artifacts (arm32)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}*.tar.gz
            install.log
            tar_contents.log
            compile.sh
          if-no-files-found: warn

  publish:
    name: Publish binaries
    needs: [android, android-arm32]
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' && github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    concurrency: release-${{ inputs.php-version-base }}-pm${{ inputs.pm-version-major }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Update latest tag target
        run: |
          git tag -f pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest
          git push -f origin pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest
          git tag -f pm${{ inputs.pm-version-major }}-latest
          git push -f origin pm${{ inputs.pm-version-major }}-latest
