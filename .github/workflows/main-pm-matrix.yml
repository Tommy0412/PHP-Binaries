name: Build PHP binaries

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: 'PocketMine-MP major version'
        required: true
        type: number
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
      special-release:
        description: 'Special release type to create (pm-default-latest, pm-default, none)'
        required: true
        type: string
      pm-preview:
        description: 'Mark releases as pre-release'
        required: true
        type: boolean

env:
  MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' }}

    steps:
      - uses: actions/checkout@v5

      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c libzip-dev libssl-dev zlib1g-dev

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}-v2
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-arm64-v2

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP (arm64)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          ./compile.sh -t android-aarch64 -x -j 4 -g -P ${{ inputs.pm-version-major }} -c ./download_cache -D -z ${{ inputs.php-version-base }} 2>&1 | tee build.log

      - name: Debug directory structure
        run: |
          echo "Current directory contents:" > debug.log
          ls -la . >> debug.log
          echo "Bin directory contents:" >> debug.log
          ls -laR bin >> debug.log 2>&1 || echo "bin directory does not exist" >> debug.log
          echo "bin/php7 contents:" >> debug.log
          ls -laR bin/php7 >> debug.log 2>&1 || echo "bin/php7 directory does not exist" >> debug.log
          if [ -f bin/php7/bin/php ]; then
            file bin/php7/bin/php >> debug.log
            bin/php7/bin/php -v >> debug.log 2>&1 || echo "PHP binary not executable" >> debug.log
          else
            echo "PHP binary missing in bin/php7/bin/php" >> debug.log
          fi
          echo "Disk space usage:" >> debug.log
          df -h >> debug.log
          echo "Environment variables:" >> debug.log
          env >> debug.log
          echo "install_data contents:" >> debug.log
          ls -laR install_data >> debug.log 2>&1 || echo "install_data directory does not exist" >> debug.log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-arm64
          path: debug.log
          if-no-files-found: warn

      - name: Upload working directory for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: working-directory-arm64
          path: ./**
          if-no-files-found: warn

      - name: Create tarball (arm64)
        run: |
          if [ -d "bin/php7" ] && [ "$(ls -A bin/php7)" ]; then
            mv bin/php7/* bin/ || true
            rm -rf bin/php7
            tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}.tar.gz bin
            tar -tzf ./PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}.tar.gz > tar_contents.log
          else
            echo "Error: bin/php7 directory missing or empty" >> debug.log
            ls -laR bin >> debug.log 2>&1 || echo "bin directory does not exist" >> debug.log
            mkdir -p bin
            echo "Dummy file - build failed" > bin/dummy.txt
            tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}.tar.gz bin
            echo "Created dummy tarball due to error" > tar_contents.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-arm64
          path: install.log
          if-no-files-found: warn

      - name: Upload tar contents log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tar-contents-log-arm64
          path: tar_contents.log
          if-no-files-found: warn

      - name: Upload artifacts (arm64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}
          path: |
            ./PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}.tar.gz
            install.log
            tar_contents.log
            debug.log
            compile.sh
          if-no-files-found: warn

  android-arm32:
    name: Android arm32
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' }}

    steps:
      - uses: actions/checkout@v5

      - name: Clean disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c libzip-dev libssl-dev zlib1g-dev

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}-v2
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-arm32-v2

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = arm-linux-musleabihf" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP (arm32)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          ./compile.sh -t android-arm -x -j 4 -g -P ${{ inputs.pm-version-major }} -c ./download_cache -D -z ${{ inputs.php-version-base }} 2>&1 | tee build.log

      - name: Debug directory structure
        run: |
          echo "Current directory contents:" > debug.log
          ls -la . >> debug.log
          echo "Bin directory contents:" >> debug.log
          ls -laR bin >> debug.log 2>&1 || echo "bin directory does not exist" >> debug.log
          echo "bin/php7 contents:" >> debug.log
          ls -laR bin/php7 >> debug.log 2>&1 || echo "bin/php7 directory does not exist" >> debug.log
          if [ -f bin/php7/bin/php ]; then
            file bin/php7/bin/php >> debug.log
            bin/php7/bin/php -v >> debug.log 2>&1 || echo "PHP binary not executable" >> debug.log
          else
            echo "PHP binary missing in bin/php7/bin/php" >> debug.log
          fi
          echo "Disk space usage:" >> debug.log
          df -h >> debug.log
          echo "Environment variables:" >> debug.log
          env >> debug.log
          echo "install_data contents:" >> debug.log
          ls -laR install_data >> debug.log 2>&1 || echo "install_data directory does not exist" >> debug.log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-arm32
          path: debug.log
          if-no-files-found: warn

      - name: Upload working directory for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: working-directory-arm32
          path: ./**
          if-no-files-found: warn

      - name: Create tarball (arm32)
        run: |
          if [ -d "bin/php7" ] && [ "$(ls -A bin/php7)" ]; then
            mv bin/php7/* bin/ || true
            rm -rf bin/php7
            tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}.tar.gz bin
            tar -tzf ./PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}.tar.gz > tar_contents.log
          else
            echo "Error: bin/php7 directory missing or empty" >> debug.log
            ls -laR bin >> debug.log 2>&1 || echo "bin directory does not exist" >> debug.log
            mkdir -p bin
            echo "Dummy file - build failed" > bin/dummy.txt
            tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}.tar.gz bin
            echo "Created dummy tarball due to error" > tar_contents.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm32
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-arm32
          path: install.log
          if-no-files-found: warn

      - name: Upload tar contents log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tar-contents-log-arm32
          path: tar_contents.log
          if-no-files-found: warn

      - name: Upload artifacts (arm32)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}
          path: |
            ./PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}.tar.gz
            install.log
            tar_contents.log
            debug.log
            compile.sh
          if-no-files-found: warn

  publish:
    name: Publish binaries
    needs: [android, android-arm32]
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' && github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    concurrency: release-${{ inputs.php-version-base }}-pm${{ inputs.pm-version-major }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download Arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}
          path: artifacts/arm64

      - name: Download Arm32 Artifact
        uses: actions/download-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}
          path: artifacts/arm32

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: PHP-Build-${{ github.run_number }}
          release_name: PHP Build ${{ github.run_number }}
          draft: false
          prerelease: ${{ inputs.pm-preview }}
          body: |
            PHP binaries for PocketMine-MP ${{ inputs.pm-version-major }} (PHP ${{ inputs.php-version-base }}).
            - Arm64: Android aarch64
            - Arm32: Android armv7
            Note: If tarballs contain only dummy.txt, check debug.log and install.log for build errors.

      - name: Upload Arm64 Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/arm64/PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}.tar.gz
          asset_name: PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Arm32 Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/arm32/PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}.tar.gz
          asset_name: PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}.tar.gz
          asset_content_type: application/gzip
