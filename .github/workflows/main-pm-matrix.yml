name: Build PHP binaries

on:
  workflow_call:
    inputs:
      pm-version-major:
        description: 'Android PHP major version'
        required: true
        type: number
      php-version-base:
        description: 'PHP base version'
        required: true
        type: string
      special-release:
        description: 'Special release type to create (pm-default-latest, pm-default, none)'
        required: true
        type: string
      pm-preview:
        description: "Mark releases as pre-release"
        required: true
        type: boolean

env:
  MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c upx-ucl cmake pkg-config

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-arm64

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP (arm64)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          # Remove -D flag to avoid separate symbols, and ensure shared library build
          ./compile.sh -t android-aarch64 -x -j 4 -g -P ${{ inputs.pm-version-major }} -c ./download_cache -z ${{ inputs.php-version-base }} 2>&1 | tee build.log

      - name: Create tarball (arm64)
        if: success()
        run: |
          echo "=== Debugging directory structure ==="
          ls -la || true
          echo "=== Checking for libphp.so ==="
          find . -name "libphp.so" -type f || true
          echo "=== Checking bin directory ==="
          ls -la bin/ || true
          echo "=== Checking headers directory ==="
          ls -la headers/ || true
          echo "=== Checking source-headers directory ==="
          ls -la source-headers/ || true
          
          # Create a structured output directory
          mkdir -p php-android-output
          
          # Copy the shared library
          if [ -f "bin/php7/lib/libphp.so" ]; then
            mkdir -p php-android-output/lib
            cp bin/php7/lib/libphp.so php-android-output/lib/
          elif [ -f "bin/lib/libphp.so" ]; then
            mkdir -p php-android-output/lib
            cp bin/lib/libphp.so php-android-output/lib/
          fi
          
          # Copy headers
          if [ -d "headers" ]; then
            mkdir -p php-android-output/include
            cp -r headers/* php-android-output/include/
          fi
          
          # Copy source headers
          if [ -d "source-headers" ]; then
            mkdir -p php-android-output/source-headers
            cp -r source-headers/* php-android-output/source-headers/
          fi
          
          # Copy pkg-config file if exists
          if [ -f "bin/php7/lib/pkgconfig/libphp.pc" ]; then
            mkdir -p php-android-output/lib/pkgconfig
            cp bin/php7/lib/pkgconfig/libphp.pc php-android-output/lib/pkgconfig/
          fi
          
          # Create README
          cat > php-android-output/README.md << EOF
          PHP ${{ inputs.php-version-base }} Android Shared Library
          ====================================
          
          This archive contains:
          - libphp.so: PHP shared library for Android
          - include/: Header files for embedding PHP
          - source-headers/: Complete source headers
          - lib/pkgconfig/: pkg-config file for linking
          
          Usage in Android:
          1. Place libphp.so in your app's jniLibs directory
          2. Use JNI to load and call PHP functions
          3. Include headers for extension development
          
          Built for: Android ARM64
          PHP Version: ${{ inputs.php-version-base }}
          PocketMine-MP: ${{ inputs.pm-version-major }}
          EOF
          
          # Create tarball with structured content
          tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}-shared.tar.gz php-android-output/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-arm64
          path: install.log
          if-no-files-found: warn

      - name: Upload artifacts (arm64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}-shared
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm64-${{ inputs.pm-version-major }}*.tar.gz
            install.log
            compile.sh
          if-no-files-found: warn

  android-arm32:
    name: Android arm32
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' }}

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c upx-ucl cmake pkg-config

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-ssl-https-${{ hashFiles('./compile.sh') }}
          restore-keys: compile-sh-cache-ssl-https-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-arm32

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = arm-linux-musleabihf" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler"

      - name: Compile PHP (arm32)
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          # Remove -D flag to avoid separate symbols, and ensure shared library build
          ./compile.sh -t android-arm -x -j 4 -g -P ${{ inputs.pm-version-major }} -c ./download_cache -z ${{ inputs.php-version-base }} 2>&1 | tee build.log

      - name: Create tarball (arm32)
        if: success()
        run: |
          echo "=== Debugging directory structure ==="
          ls -la || true
          echo "=== Checking for libphp.so ==="
          find . -name "libphp.so" -type f || true
          echo "=== Checking bin directory ==="
          ls -la bin/ || true
          echo "=== Checking headers directory ==="
          ls -la headers/ || true
          echo "=== Checking source-headers directory ==="
          ls -la source-headers/ || true
          
          # Create a structured output directory
          mkdir -p php-android-output
          
          # Copy the shared library
          if [ -f "bin/php7/lib/libphp.so" ]; then
            mkdir -p php-android-output/lib
            cp bin/php7/lib/libphp.so php-android-output/lib/
          elif [ -f "bin/lib/libphp.so" ]; then
            mkdir -p php-android-output/lib
            cp bin/lib/libphp.so php-android-output/lib/
          fi
          
          # Copy headers
          if [ -d "headers" ]; then
            mkdir -p php-android-output/include
            cp -r headers/* php-android-output/include/
          fi
          
          # Copy source headers
          if [ -d "source-headers" ]; then
            mkdir -p php-android-output/source-headers
            cp -r source-headers/* php-android-output/source-headers/
          fi
          
          # Copy pkg-config file if exists
          if [ -f "bin/php7/lib/pkgconfig/libphp.pc" ]; then
            mkdir -p php-android-output/lib/pkgconfig
            cp bin/php7/lib/pkgconfig/libphp.pc php-android-output/lib/pkgconfig/
          fi
          
          # Create README
          cat > php-android-output/README.md << EOF
          PHP ${{ inputs.php-version-base }} Android Shared Library
          ====================================
          
          This archive contains:
          - libphp.so: PHP shared library for Android
          - include/: Header files for embedding PHP
          - source-headers/: Complete source headers
          - lib/pkgconfig/: pkg-config file for linking
          
          Usage in Android:
          1. Place libphp.so in your app's jniLibs directory
          2. Use JNI to load and call PHP functions
          3. Include headers for extension development
          
          Built for: Android ARM32
          PHP Version: ${{ inputs.php-version-base }}
          PocketMine-MP: ${{ inputs.pm-version-major }}
          EOF
          
          # Create tarball with structured content
          tar -czf ./PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}-shared.tar.gz php-android-output/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm32
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-arm32
          path: install.log
          if-no-files-found: warn

      - name: Upload artifacts (arm32)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}-shared
          path: |
            ./*PHP-${{ inputs.php-version-base }}-Android-arm32-${{ inputs.pm-version-major }}*.tar.gz
            install.log
            compile.sh
          if-no-files-found: warn

  publish:
    name: Publish binaries
    needs: [android, android-arm32]
    runs-on: ubuntu-latest
    if: ${{ inputs.php-version-base == '8.4' && github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    concurrency: release-${{ inputs.php-version-base }}-pm${{ inputs.pm-version-major }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded artifacts
        run: |
          find artifacts/ -type f -name "*.tar.gz" | head -10

      - name: Update latest tag target
        run: |
          git tag -f pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest
          git push -f origin pm${{ inputs.pm-version-major }}-php-${{ inputs.php-version-base }}-latest
          git tag -f pm${{ inputs.pm-version-major }}-latest
          git push -f origin pm${{ inputs.pm-version-major }}-latest
