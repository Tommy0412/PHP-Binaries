name: Build and publish PHP binaries

on:
  push:
    branches: 
      - stable
      - main
    tags-ignore: "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Android PHP (ARM64)
    runs-on: ubuntu-latest

    env:
      MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c upx-ucl cmake pkg-config

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-android-aarch64-${{ hashFiles('./compile.sh') }}
          restore-keys: |
            compile-sh-cache-android-aarch64-
            compile-sh-cache-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler-android-aarch64
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-android-aarch64

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make-android-aarch64
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make-android-aarch64
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler-android-aarch64"

      - name: Compile PHP
        run: |
          export PATH="${{ github.workspace }}/compiler-android-aarch64/bin:$PATH"
          set -ex
          ./compile.sh -t android-aarch64 -x -j 4 -g -P 5 -c ./download_cache -z 8.4

      - name: Create simple tarball
        run: |
          echo "=== CREATING SIMPLE TARBALL ==="
          
          # Just tar up the entire bin directory
          if [ -d "bin" ]; then
            echo "Creating tarball from bin directory..."
            tar -czf ./PHP-8.4-Android-ARM64-5.tar.gz bin/
            echo "Tarball created successfully"
            ls -lh PHP-8.4-Android-ARM64-5.tar.gz
          else
            echo "ERROR: bin directory not found!"
            ls -la
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PHP-8.4-Android-ARM64-5
          path: |
            ./PHP-8.4-Android-ARM64-5.tar.gz
            ./install.log
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [android-build]
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: PHP-*
          merge-multiple: true

      - name: Verify artifacts
        run: |
          echo "=== VERIFYING ARTIFACTS ==="
          find ./artifacts -type f -name "*.tar.gz"
          echo "=== TARBALL CONTENTS ==="
          find ./artifacts -name "*.tar.gz" -exec tar -tzf {} \; | head -20

      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: "./artifacts/**/*.tar.gz"
          name: PHP Android Build - ${{ github.run_number }}
          tag: php-android-${{ github.run_number }}
          body: |
            PHP 8.4 for Android ARM64
            
            Built from commit: ${{ github.sha }}
            Build number: ${{ github.run_number }}
            
            Contains PHP binary and libraries for Android.
          draft: false
          prerelease: false
