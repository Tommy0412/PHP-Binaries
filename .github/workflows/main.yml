name: Build and publish PHP binaries

on:
  push:
    branches: 
      - stable
      - main
    tags-ignore: "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Android PHP Library (ARM64)
    runs-on: ubuntu-latest

    env:
      MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c upx-ucl cmake pkg-config

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-android-aarch64-${{ hashFiles('./compile.sh') }}
          restore-keys: |
            compile-sh-cache-android-aarch64-
            compile-sh-cache-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler-android-aarch64
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-android-aarch64

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make-android-aarch64
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make-android-aarch64
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler-android-aarch64"

      - name: Compile PHP
        run: |
          export PATH="${{ github.workspace }}/compiler-android-aarch64/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          # Build as shared library for Android
          ./compile.sh -t android-aarch64 -x -j 4 -g -P 5 -c ./download_cache -z 8.4 2>&1 | tee build.log

      - name: Debug file structure
        if: always()
        run: |
          echo "=== COMPLETE FILE STRUCTURE ==="
          find . -type f -name "*.so" | head -20
          echo "=== BIN DIRECTORY ==="
          ls -la bin/ 2>/dev/null || echo "bin/ directory not found"
          echo "=== INSTALL_DATA DIRECTORY ==="
          ls -la install_data/ 2>/dev/null || echo "install_data/ directory not found"
          echo "=== CHECKING FOR LIBPHP ==="
          find . -name "*libphp*" -type f 2>/dev/null | head -20
          echo "=== CHECKING FOR PHP BINARIES ==="
          find . -name "php" -type f 2>/dev/null | head -10
          echo "=== CURRENT DIRECTORY CONTENTS ==="
          ls -la

      - name: Create tarball from whatever we have
        if: success()
        run: |
          # Create output directory
          mkdir -p php-android-output
          
          # Try to find and copy libphp.so
          echo "=== Searching for libphp.so ==="
          if find . -name "libphp.so" -type f | head -1 | grep -q .; then
            LIBPHP_PATH=$(find . -name "libphp.so" -type f | head -1)
            mkdir -p php-android-output/lib
            cp "$LIBPHP_PATH" php-android-output/lib/
            echo "Found and copied libphp.so from: $LIBPHP_PATH"
          else
            echo "WARNING: libphp.so not found, checking for any PHP binaries"
            # If no libphp.so, try to find the PHP binary
            if find . -name "php" -type f | head -1 | grep -q .; then
              PHP_BINARY_PATH=$(find . -name "php" -type f | head -1)
              mkdir -p php-android-output/bin
              cp "$PHP_BINARY_PATH" php-android-output/bin/
              echo "Found and copied PHP binary from: $PHP_BINARY_PATH"
            else
              echo "ERROR: No PHP binaries or libraries found!"
              exit 1
            fi
          fi
          
          # Try to find headers
          echo "=== Searching for headers ==="
          if [ -d "headers" ] && [ "$(ls -A headers 2>/dev/null)" ]; then
            mkdir -p php-android-output/include
            cp -r headers/* php-android-output/include/
            echo "Copied headers from headers/"
          elif find . -path "*/include/*" -name "*.h" | head -1 | grep -q .; then
            mkdir -p php-android-output/include
            find . -path "*/include/*" -name "*.h" -exec cp --parents {} php-android-output/ \; 2>/dev/null || true
            echo "Copied headers from include directories"
          else
            echo "WARNING: No headers found"
          fi
          
          # Try to find source headers
          echo "=== Searching for source headers ==="
          if [ -d "source-headers" ] && [ "$(ls -A source-headers 2>/dev/null)" ]; then
            mkdir -p php-android-output/source-headers
            cp -r source-headers/* php-android-output/source-headers/
            echo "Copied source headers"
          fi
          
          # Create README with build info
          cat > php-android-output/README.md << EOF
          PHP Android Build
          =================
          
          This archive contains the PHP build artifacts for Android ARM64.
          
          Build Information:
          - PHP Version: 8.4
          - Target: Android ARM64 (aarch64)
          - PocketMine-MP: 5
          - Build Date: $(date)
          
          Contents may include:
          - libphp.so: PHP shared library
          - php: PHP binary (if shared library not available)
          - Headers for development
          
          Check the file structure above to see what was actually included.
          EOF
          
          # Show what we actually collected
          echo "=== FINAL OUTPUT STRUCTURE ==="
          find php-android-output -type f | sort
          
          # Create tarball
          tar -czf ./PHP-8.4-Android-ARM64-5-shared.tar.gz php-android-output/
          echo "Created PHP-8.4-Android-ARM64-5-shared.tar.gz"
          
          # Show tarball contents
          echo "=== TARBALL CONTENTS ==="
          tar -tzf ./PHP-8.4-Android-ARM64-5-shared.tar.gz | head -20

      - name: Verify tarball creation
        run: |
          if [ -f "PHP-8.4-Android-ARM64-5-shared.tar.gz" ]; then
            echo "Tarball created successfully"
            ls -lh PHP-8.4-Android-ARM64-5-shared.tar.gz
            echo "Tarball contents:"
            tar -tzf PHP-8.4-Android-ARM64-5-shared.tar.gz | head -10
          else
            echo "ERROR: Tarball was not created!"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-arm64
          path: install.log
          if-no-files-found: warn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PHP-8.4-Android-ARM64-5-shared
          path: |
            ./PHP-8.4-Android-ARM64-5-shared.tar.gz
            ./build.log
            ./install.log
            ./compile.sh
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [android-build]
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: PHP-*-shared
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          echo "=== DOWNLOADED ARTIFACTS ==="
          find ./artifacts -type f -name "*.tar.gz"
          echo "=== ARTIFACT CONTENTS ==="
          find ./artifacts -name "*.tar.gz" -exec sh -c 'echo "File: {}"; tar -tzf "{}" 2>/dev/null | head -5' \;

      - name: Generate release notes
        run: |
          echo "# PHP Android Build Release" > changelog.md
          echo "" >> changelog.md
          echo "**Build Information:**" >> changelog.md
          echo "- Build Number: ${{ github.run_number }}" >> changelog.md
          echo "- Commit: ${{ github.sha }}" >> changelog.md
          echo "- Branch: ${{ github.ref_name }}" >> changelog.md
          echo "- Workflow: ${{ github.workflow }}" >> changelog.md
          echo "" >> changelog.md
          echo "**Included Artifacts:**" >> changelog.md
          echo "" >> changelog.md
          find ./artifacts -name "*.tar.gz" -type f -exec basename {} \; | while read file; do
            echo "- \`$file\`" >> changelog.md
          done
          echo "" >> changelog.md
          echo "**Notes:**" >> changelog.md
          echo "This release contains PHP build artifacts for Android ARM64." >> changelog.md
          echo "Check the tarball contents for specific files included." >> changelog.md

      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: "./artifacts/**/*.tar.gz"
          name: PHP Android Build - ${{ github.run_number }}
          tag: php-android-build-${{ github.run_number }}
          commit: ${{ github.sha }}
          allowUpdates: false
          bodyFile: changelog.md
          draft: false
          prerelease: false
