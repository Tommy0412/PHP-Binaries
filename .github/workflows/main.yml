name: Build and publish PHP binaries

on:
  push:
    branches: 
      - stable
      - main
    tags-ignore: "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-builds:
    name: Build Android PHP Libraries
    strategy:
      matrix:
        include:
          - pm-version-major: 5
            php-version-base: "8.4"
            target: android-aarch64
            arch-name: arm64
          - pm-version-major: 5
            php-version-base: "8.4"
            target: android-arm
            arch-name: arm32

    runs-on: ubuntu-latest

    env:
      MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

    steps:
      - uses: actions/checkout@v5

      - name: Install tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget libc-bin gzip bzip2 bison g++ git re2c upx-ucl cmake pkg-config

      - name: Prepare compile.sh download cache
        id: download-cache
        uses: actions/cache@v4
        with:
          path: ./download_cache
          key: compile-sh-cache-${{ matrix.target }}-${{ hashFiles('./compile.sh') }}
          restore-keys: |
            compile-sh-cache-${{ matrix.target }}-
            compile-sh-cache-

      - name: Fetch compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/compiler-${{ matrix.target }}
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}-${{ matrix.target }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make-${{ matrix.target }}
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make-${{ matrix.target }}
        run: |
          echo "TARGET = ${{ matrix.target == 'android-aarch64' && 'aarch64-linux-musl' || 'arm-linux-musleabihf' }}" > config.mak
          make -j$(nproc)
          make install
          mv ./output "${{ github.workspace }}/compiler-${{ matrix.target }}"

      - name: Compile PHP
        run: |
          export PATH="${{ github.workspace }}/compiler-${{ matrix.target }}/bin:$PATH"
          set -ex
          trap "exit 1" ERR
          # Build as shared library for Android
          ./compile.sh -t ${{ matrix.target }} -x -j 4 -g -P ${{ matrix.pm-version-major }} -c ./download_cache -z ${{ matrix.php-version-base }} 2>&1 | tee build.log

      - name: Create tarball
        if: success()
        run: |
          echo "=== Debugging directory structure ==="
          ls -la || true
          echo "=== Checking for libphp.so ==="
          find . -name "libphp.so" -type f || true
          echo "=== Checking bin directory ==="
          ls -la bin/ || true
          
          # Create a structured output directory
          mkdir -p php-android-output
          
          # Copy the shared library
          if [ -f "bin/php7/lib/libphp.so" ]; then
            mkdir -p php-android-output/lib
            cp bin/php7/lib/libphp.so php-android-output/lib/
          elif [ -f "bin/lib/libphp.so" ]; then
            mkdir -p php-android-output/lib
            cp bin/lib/libphp.so php-android-output/lib/
          else
            echo "ERROR: libphp.so not found!"
            find . -name "*.so" -type f | head -10
            exit 1
          fi
          
          # Copy headers if they exist
          if [ -d "headers" ]; then
            mkdir -p php-android-output/include
            cp -r headers/* php-android-output/include/ 2>/dev/null || true
          fi
          
          # Copy source headers if they exist
          if [ -d "source-headers" ]; then
            mkdir -p php-android-output/source-headers
            cp -r source-headers/* php-android-output/source-headers/ 2>/dev/null || true
          fi
          
          # Copy pkg-config file if exists
          if [ -f "bin/php7/lib/pkgconfig/libphp.pc" ]; then
            mkdir -p php-android-output/lib/pkgconfig
            cp bin/php7/lib/pkgconfig/libphp.pc php-android-output/lib/pkgconfig/
          elif [ -f "bin/lib/pkgconfig/libphp.pc" ]; then
            mkdir -p php-android-output/lib/pkgconfig
            cp bin/lib/pkgconfig/libphp.pc php-android-output/lib/pkgconfig/
          fi
          
          # Create README
          cat > php-android-output/README.md << EOF
          PHP ${{ matrix.php-version-base }} Android Shared Library
          ====================================
          
          This archive contains PHP compiled as a shared library for Android.
          
          Contents:
          - libphp.so: PHP shared library
          - include/: Header files for embedding PHP
          - source-headers/: Source headers for development
          - lib/pkgconfig/: pkg-config file for linking
          
          Built for: Android ${{ matrix.arch-name }}
          PHP Version: ${{ matrix.php-version-base }}
          PocketMine-MP: ${{ matrix.pm-version-major }}
          
          Usage in Android:
          1. Place libphp.so in your app's jniLibs directory
          2. Use JNI to load the library: System.loadLibrary("php")
          3. Include headers in your NDK project for extension development
          EOF
          
          # Create tarball with structured content
          tar -czf ./PHP-${{ matrix.php-version-base }}-Android-${{ matrix.arch-name }}-${{ matrix.pm-version-major }}-shared.tar.gz php-android-output/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch-name }}
          path: build.log
          if-no-files-found: warn

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.arch-name }}
          path: install.log
          if-no-files-found: warn

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHP-${{ matrix.php-version-base }}-Android-${{ matrix.arch-name }}-${{ matrix.pm-version-major }}-shared
          path: |
            ./PHP-${{ matrix.php-version-base }}-Android-${{ matrix.arch-name }}-${{ matrix.pm-version-major }}-shared.tar.gz
            install.log
            compile.sh
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [android-builds]
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'stable' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[no release]') }}
    
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: PHP-*-shared
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -name "*.tar.gz" -type f
          echo "Total .tar.gz files:"
          find ./artifacts -name "*.tar.gz" -type f | wc -l

      - name: Generate release notes
        run: |
          echo "# PHP Android Shared Libraries Release" > changelog.md
          echo "" >> changelog.md
          echo "**Build Information:**" >> changelog.md
          echo "- Build Number: ${{ github.run_number }}" >> changelog.md
          echo "- Commit: ${{ github.sha }}" >> changelog.md
          echo "- Branch: ${{ github.ref_name }}" >> changelog.md
          echo "- Workflow: ${{ github.workflow }}" >> changelog.md
          echo "" >> changelog.md
          echo "**Included Libraries:**" >> changelog.md
          echo "" >> changelog.md
          find ./artifacts -name "*.tar.gz" -type f -exec basename {} \; | sort | while read file; do
            echo "- \`$file\`" >> changelog.md
          done
          echo "" >> changelog.md
          echo "**Usage:**" >> changelog.md
          echo "These are PHP shared libraries (\`libphp.so\`) for Android, including headers for embedding PHP in Android applications." >> changelog.md

      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          artifacts: "./artifacts/**/*.tar.gz"
          name: PHP Android Libraries - Build ${{ github.run_number }}
          tag: php-android-${{ github.run_number }}
          commit: ${{ github.sha }}
          allowUpdates: false
          bodyFile: changelog.md
          draft: false
          prerelease: false
